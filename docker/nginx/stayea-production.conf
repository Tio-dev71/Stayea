# ==============================================================================
# STAYEA Production Nginx Configuration
# Multi-domain routing: stayea.com, hub.stayea.com, admin.stayea.com, api.stayea.com
# Hardened for Production Security (HSTS, TLS 1.3, Rate Limits, Gzip, HTTP/2)
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=stayea_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stayea_auth_limit:10m rate=5r/s;

# Common proxy headers
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# ------------------------------------------------------------------------------
# 1. API Subdomain: api.stayea.com -> NestJS (Port 3000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.stayea.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.stayea.com;

    ssl_certificate /etc/letsencrypt/live/api.stayea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.stayea.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        limit_req zone=stayea_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Strict rate limit for auth endpoints
    location ~* ^/api/auth/(login|register) {
        limit_req zone=stayea_auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Payment Webhooks (No buffering to ensure raw signature integrity)
    location /api/stayea/payments/webhook {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ------------------------------------------------------------------------------
# 2. Customer Website: stayea.com (and www.stayea.com) -> Next.js (Port 8080)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name stayea.com www.stayea.com;
    return 301 https://stayea.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stayea.com;
    return 301 https://stayea.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stayea.com;

    ssl_certificate /etc/letsencrypt/live/stayea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stayea.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Static file caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8080/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

# ------------------------------------------------------------------------------
# 3. Partner Hub Portal: hub.stayea.com -> Next.js (Rewrite /hub)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name hub.stayea.com;
    return 301 https://hub.stayea.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hub.stayea.com;

    ssl_certificate /etc/letsencrypt/live/hub.stayea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.stayea.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Rewrite root of hub.stayea.com to /hub internal route
    location = / {
        proxy_pass http://127.0.0.1:8080/hub;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

# ------------------------------------------------------------------------------
# 4. Admin Console: admin.stayea.com -> Next.js (Rewrite /stayea)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.stayea.com;
    return 301 https://admin.stayea.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.stayea.com;

    ssl_certificate /etc/letsencrypt/live/admin.stayea.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.stayea.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Rewrite root of admin.stayea.com to /stayea internal route
    location = / {
        proxy_pass http://127.0.0.1:8080/stayea;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

